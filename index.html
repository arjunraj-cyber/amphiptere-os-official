<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amphiptere OS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0a; color:#e0e0e0; font-family:Arial; }
    header { background:#000; padding:60px 20px; text-align:center; border-bottom:3px solid #FFD700; }
    header img { width:130px; margin-bottom:20px; cursor:pointer; }
    h1 { color:#FFD700; font-size:48px; }
    .container { max-width:950px; margin:0 auto; padding:50px 20px; text-align:center; }
    .btn { background:#FFD700; color:#000; padding:16px 35px; border-radius:10px; text-decoration:none; font-weight:bold; margin:10px; display:inline-block; }
    .section { margin:50px 0; text-align:left; }
    .section h2 { color:#FFD700; margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px; }
    .section img { max-width:100%; border-radius:12px; margin:20px 0; cursor:pointer; }
    .editable[contenteditable="true"] { outline:2px dashed #FFD700; padding:5px; }
    
    /* ADMIN PANEL */
    #adminPanel { position:fixed; top:0; right:-400px; width:380px; height:100%; background:#111; border-left:3px solid #FFD700; padding:20px; transition:0.3s; overflow-y:auto; z-index:999; }
    #adminPanel.open { right:0; }
    #adminBtn { position:fixed; top:20px; right:20px; background:red; color:white; padding:12px 20px; border:none; border-radius:8px; cursor:pointer; z-index:1000; font-weight:bold; }
    #adminPanel input, #adminPanel textarea { width:100%; padding:10px; margin:8px 0; background:#222; color:#fff; border:1px solid #444; border-radius:5px; }
    #adminPanel button { background:#FFD700; color:#000; padding:10px; border:none; border-radius:5px; width:100%; font-weight:bold; cursor:pointer; margin-top:10px; }
    #loginBox { background:#222; padding:20px; border-radius:10px; }
  </style>
</head>
<body>

<button id="adminBtn" onclick="showLogin()">Admin</button>

<div id="adminPanel">
  <h2 style="color:#FFD700">Admin Panel</h2>
  <div id="loginBox">
    <p>Enter Admin Code:</p>
    <input type="password" id="adminCode" placeholder="Default: amphiptere123">
    <button onclick="login()">Login</button>
  </div>
  
  <div id="editBox" style="display:none">
    <h3>Edit Site</h3>
    <label>Title</label>
    <input type="text" id="editTitle">
    
    <label>Tagline</label>
    <input type="text" id="editTagline">
    
    <label>Download Link</label>
    <input type="text" id="editDownload">
    
    <label>GitHub Link</label>
    <input type="text" id="editGithub">
    
    <label>About Text</label>
    <textarea id="editAbout" rows="4"></textarea>
    
    <button onclick="saveChanges()">Save Changes</button>
    <button onclick="exportCode()" style="background:#00ff00">Save & Export Code</button>
    <button onclick="logout()" style="background:#555">Logout</button>
  </div>
</div>

<header>
  <img id="logo" src="logo.png" onclick="changeImage('logo')">
  <h1 id="title" class="editable">Amphiptere OS</h1>
  <p id="tagline" class="editable">Lightweight Linux Distribution for Security & Privacy</p>
</header>

<div class="container">
  <div class="buttons">
    <a id="downloadBtn" href="#" class="btn">Download ISO</a>
    <a id="githubBtn" href="#" class="btn">View on GitHub</a>
  </div>

  <div class="section">
    <h2>About Amphiptere OS</h2>
    <p id="about" class="editable">Amphiptere OS is a lightweight Linux distribution built for performance, privacy, and security.</p>
  </div>

  <div class="section">
    <h2>Screenshots</h2>
    <img id="screenshot1" src="screenshot1.png" onclick="changeImage('screenshot1')">
  </div>
</div>

<footer style="text-align:center;padding:25px;background:#000;color:#777">© 2026 Amphiptere OS</footer>

<script>
const ADMIN_PASSWORD = "amphiptere123"; // CHANGE THIS CODE

// LOAD SAVED DATA
window.onload = function() {
  let data = JSON.parse(localStorage.getItem('amphiptereData'));
  if(data) {
    document.getElementById('title').innerText = data.title;
    document.getElementById('tagline').innerText = data.tagline;
    document.getElementById('about').innerText = data.about;
    document.getElementById('downloadBtn').href = data.download;
    document.getElementById('githubBtn').href = data.github;
    document.getElementById('logo').src = data.logo;
    document.getElementById('screenshot1').src = data.screenshot;
  }
}

function showLogin() {
  document.getElementById('adminPanel').classList.toggle('open');
}

function login() {
  if(document.getElementById('adminCode').value === ADMIN_PASSWORD) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('editBox').style.display = 'block';
    enableEdit();
    loadToForm();
    alert("Logged in! Now click text/images to edit");
  } else { alert("Wrong code!"); }
}

function logout() {
  document.getElementById('adminPanel').classList.remove('open');
  disableEdit();
}

function enableEdit() {
  document.querySelectorAll('.editable').forEach(e => e.contentEditable = true);
}
function disableEdit() {
  document.querySelectorAll('.editable').forEach(e => e.contentEditable = false);
}

function loadToForm() {
  document.getElementById('editTitle').value = document.getElementById('title').innerText;
  document.getElementById('editTagline').value = document.getElementById('tagline').innerText;
  document.getElementById('editAbout').value = document.getElementById('about').innerText;
  document.getElementById('editDownload').value = document.getElementById('downloadBtn').href;
  document.getElementById('editGithub').value = document.getElementById('githubBtn').href;
}

function saveChanges() {
  let data = {
    title: document.getElementById('editTitle').value,
    tagline: document.getElementById('editTagline').value,
    about: document.getElementById('editAbout').value,
    download: document.getElementById('editDownload').value,
    github: document.getElementById('editGithub').value,
    logo: document.getElementById('logo').src,
    screenshot: document.getElementById('screenshot1').src
  };
  localStorage.setItem('amphiptereData', JSON.stringify(data));
  location.reload();
  alert("Saved! Only you can see this on this device.");
}

function exportCode() {
  let html = document.documentElement.outerHTML;
  prompt("Copy this entire code and paste it in GitHub to make it public:", html);
}

function changeImage(id) {
  let url = prompt("Upload image to repo first, then paste filename here. ex: logo.png");
  if(url) document.getElementById(id).src = url;
}
</script>

</body>
</html>
