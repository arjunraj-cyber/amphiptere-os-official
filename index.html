<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amphiptere OS</title>
  <style>
    body { background:#0a0a0a; color:#e0e0e0; font-family:Arial; padding:20px; max-width:900px; margin:auto; }
    header { text-align:center; border-bottom:2px solid #FFD700; padding-bottom:20px; }
    header img { width:120px; }
    h1 { color:#FFD700; }
    .btn { background:#FFD700; color:#000; padding:12px 25px; border-radius:8px; text-decoration:none; margin:10px; display:inline-block; font-weight:bold; }
    .editable { border:1px dashed #444; padding:10px; margin:10px 0; min-height:50px; }
    .editable:hover { border-color:#FFD700; }
    #editBtn { position:fixed; top:10px; right:10px; background:red; color:white; padding:10px; border:none; cursor:pointer; }
  </style>
</head>
<body>

<button id="editBtn" onclick="toggleEdit()">Edit ON/OFF</button>

<header>
  <img id="logo" src="logo.png" onclick="changeImage(this)">
  <h1 id="title" class="editable" contenteditable="false">Amphiptere OS</h1>
  <p id="tagline" class="editable" contenteditable="false">Lightweight Linux Distro</p>
</header>

<div style="text-align:center; margin:30px 0;">
  <a id="btn1" href="#" class="btn" onclick="changeLink(this)">Download ISO</a>
  <a id="btn2" href="#" class="btn" onclick="changeLink(this)">GitHub</a>
</div>

<h2>About</h2>
<div id="about" class="editable" contenteditable="false">
  Write your about info here. Click "Edit ON" to edit.
</div>

<h2>Screenshots</h2>
<img id="img1" src="screenshot1.png" width="100%" onclick="changeImage(this)">

<script>
let editing = false;
function toggleEdit(){
  editing = !editing;
  document.querySelectorAll('.editable').forEach(e => e.contentEditable = editing);
  document.getElementById('editBtn').innerText = editing ? "Edit OFF & Save" : "Edit ON";
  if(!editing) alert("Copied! Now go to GitHub and paste this page to save changes.");
}

function changeLink(el){
  if(editing) {
    let newLink = prompt("Enter new link:", el.href);
    if(newLink) el.href = newLink;
  }
}
function changeImage(el){
  if(editing) {
    let newImg = prompt("Upload image to repo first. Then enter filename:", el.src.split('/').pop());
    if(newImg) el.src = newImg;
  }
}
</script>

</body>
</html>
